spring.application.name=backend

# Todos os endpoints ficam sob /api (ex.: /api/auth/login, /api/projects)
server.servlet.context-path=/api

spring.mongodb.uri=mongodb://localhost:27017/scenara
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Carrega o .env local (ignorado pelo git) para rodar sem exportar variáveis manualmente.
# Variáveis de ambiente reais continuam tendo prioridade. Os dois caminhos cobrem rodar de backend/ ou da raiz.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Origens autorizadas a chamar a API pelo navegador (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Inclui a mensagem e os erros de validação no corpo das respostas de erro (exibidos pelo frontend)
server.error.include-message=always
server.error.include-binding-errors=always
